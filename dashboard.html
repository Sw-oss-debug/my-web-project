<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaFlow Dashboard</title>
    <style>
      :root {
        --bg: #07111f;
        --bg-2: #0d1b2d;
        --panel: rgba(16, 25, 40, 0.9);
        --card: rgba(11, 20, 33, 0.95);
        --line: rgba(142, 182, 255, 0.18);
        --text: #edf4ff;
        --muted: #a9bddb;
        --primary: #7c9cff;
        --primary-2: #54d2ff;
        --green: #8ef0d4;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; font-family: Inter, sans-serif; background: radial-gradient(circle at top left, rgba(124,156,255,0.18), transparent 20%), var(--bg); color: var(--text); }
      a { color: inherit; text-decoration: none; }
      button, input, textarea { font: inherit; }
      body { min-height: 100vh; }
      .shell { width: min(1400px, calc(100% - 28px)); margin: 0 auto; padding: 20px 0 40px; }
      .topbar { display: flex; justify-content: space-between; align-items: center; padding: 18px 26px; background: rgba(11, 20, 33, 0.8); border: 1px solid var(--line); border-radius: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; }
      .brand-mark { width: 32px; height: 32px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary), var(--green)); color: #07111f; }
      .nav-links { display: flex; gap: 22px; color: var(--muted); }
      .nav-actions { display: flex; align-items: center; gap: 12px; }
      .chip { padding: 10px 14px; border-radius: 999px; background: rgba(124,152,255,0.1); border: 1px solid var(--line); color: var(--text); }
      .primary-btn { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: white; border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; }
      .secondary-btn { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; }
      .layout { display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 22px; margin-top: 22px; }
      .sidebar, .content { background: rgba(11,20,33,0.82); border: 1px solid var(--line); border-radius: 22px; }
      .sidebar { padding: 18px; }
      .side-title { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 18px; }
      .nav-list { display: grid; gap: 8px; }
      .nav-item { padding: 12px 14px; border-radius: 12px; color: var(--muted); background: rgba(255,255,255,0.02); border: 1px solid transparent; }
      .nav-item.active { background: rgba(124,156,255,0.08); border-color: rgba(124,156,255,0.22); color: var(--text); }
      .nav-item span { margin-right: 8px; }
      .card-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 18px; padding: 18px; }
      .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
      .stat-label { color: var(--muted); font-size: 0.8rem; }
      .stat-value { margin-top: 10px; font-size: 2rem; font-weight: 800; }
      .stat-trend { margin-top: 6px; color: var(--green); font-size: 0.8rem; }
      .content { padding: 18px; }
      .panel-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 18px; }
      .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
      .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.04); }
      .panel-title { font-weight: 700; }
      .assistant { padding: 16px; }
      .chat-thread { min-height: 320px; max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
      .msg { max-width: 82%; padding: 12px 14px; border-radius: 16px; line-height: 1.7; }
      .msg.ai { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05); align-self: flex-start; }
      .msg.user { background: linear-gradient(135deg, rgba(124,156,255,0.22), rgba(84,210,255,0.12)); border: 1px solid rgba(124,156,255,0.2); align-self: flex-end; }
      .chat-form { display: flex; gap: 10px; margin-top: 12px; }
      .chat-form input { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; color: var(--text); padding: 12px 14px; }
      .task-list { padding: 18px; display: grid; gap: 12px; }
      .task-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.04); }
      .task-item small { color: var(--muted); }
      .badge { padding: 6px 8px; border-radius: 999px; background: rgba(142,240,212,0.12); color: var(--green); font-size: 0.75rem; }
      .status { padding: 6px 10px; border-radius: 999px; font-size: 0.7rem; }
      .online { background: rgba(142,240,212,0.12); color: var(--green); }
      .warning { background: rgba(255,125,171,0.11); color: #ffb1d2; }
      .hidden { display: none !important; }
      @media (max-width: 980px) {
        .layout, .panel-grid, .card-grid { grid-template-columns: 1fr; }
        .sidebar { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">N</span>
          <span>NovaFlow</span>
        </div>
        <nav class="nav-links">
          <a href="/index.html">首頁</a>
          <a href="/index.html#pricing">方案</a>
          <a href="/index.html#demo">示範</a>
        </nav>
        <div class="nav-actions">
          <span class="chip" id="userBadge">未登入</span>
          <button class="primary-btn" id="logoutBtn">登出</button>
        </div>
      </header>

      <div class="layout">
        <aside class="sidebar">
          <div class="side-title">工作台</div>
          <div class="nav-list">
            <div class="nav-item active"><span>📊</span>總覽</div>
            <div class="nav-item"><span>💬</span>AI 助理</div>
            <div class="nav-item"><span>📈</span>業績分析</div>
            <div class="nav-item"><span>🧩</span>自動化流程</div>
          </div>
        </aside>

        <main class="content">
          <div class="card-grid">
            <div class="stat-card">
              <div class="stat-label">每月節省</div>
              <div class="stat-value">NT$ 1.4M</div>
              <div class="stat-trend">+18.5% 本月</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">客服效率</div>
              <div class="stat-value">76%</div>
              <div class="stat-trend">提升 24%</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">成交率</div>
              <div class="stat-value">32%</div>
              <div class="stat-trend">+8.4% 提升</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">會員方案</div>
              <div class="stat-value" id="planValue">Growth</div>
              <div class="stat-trend" id="planStatus">已啟用</div>
            </div>
          </div>

          <div class="panel-grid" style="margin-top: 18px;">
            <section class="panel">
              <div class="panel-header">
                <div class="panel-title">AI 智慧助理</div>
                <span class="status online">● 在線</span>
              </div>
              <div class="assistant">
                <div class="chat-thread" id="chatThread">
                  <div class="msg ai">您好！我可以幫你檢查客服流程、銷售漏斗與商機優先級，直接告訴我你的目標即可。</div>
                </div>
                <form class="chat-form" id="dashboardChatForm">
                  <input id="dashboardChatInput" type="text" placeholder="輸入你的業務問題..." />
                  <button type="submit" class="primary-btn">送出</button>
                </form>
              </div>
            </section>

            <aside class="panel">
              <div class="panel-header">
                <div class="panel-title">進度任務</div>
                <span class="status warning">4 項待辦</span>
              </div>
              <div class="task-list">
                <div class="task-item">
                  <div>
                    <strong>客服回覆模板</strong><br />
                    <small>更新 FAQ 自動回覆</small>
                  </div>
                  <span class="badge">進行中</span>
                </div>
                <div class="task-item">
                  <div>
                    <strong>商機標註</strong><br />
                    <small>導入高意願客戶分群</small>
                  </div>
                  <span class="badge">已完成</span>
                </div>
                <div class="task-item">
                  <div>
                    <strong>轉化追蹤</strong><br />
                    <small>分析 7 天成交漏斗</small>
                  </div>
                  <span class="badge">待處理</span>
                </div>
                <div class="task-item">
                  <div>
                    <strong>AI 行銷腳本</strong><br />
                    <small>新增 3 組內容模板</small>
                  </div>
                  <span class="badge">已上線</span>
                </div>
              </div>
            </aside>
          </div>
        </main>
      </div>
    </div>

    <script>
      const userBadge = document.getElementById('userBadge');
      const planValue = document.getElementById('planValue');
      const planStatus = document.getElementById('planStatus');
      const logoutBtn = document.getElementById('logoutBtn');
      const chatThread = document.getElementById('chatThread');
      const dashboardChatForm = document.getElementById('dashboardChatForm');
      const dashboardChatInput = document.getElementById('dashboardChatInput');

      function appendMessage(role, text) {
        const msg = document.createElement('div');
        msg.className = 'msg ' + role;
        msg.textContent = text;
        chatThread.appendChild(msg);
        chatThread.scrollTop = chatThread.scrollHeight;
      }

      function getStoredUser() {
        const email = localStorage.getItem('novaflowMember');
        const mode = localStorage.getItem('novaflowMode');
        const plan = localStorage.getItem('novaflowPlan') || 'Growth';
        return { email, mode, plan };
      }

      function initDashboard() {
        const user = getStoredUser();
        if (!user.email) {
          window.location.href = '/index.html';
          return;
        }

        const name = user.email.split('@')[0];
        userBadge.textContent = `會員：${name}`;
        planValue.textContent = user.plan;
        planStatus.textContent = user.mode === 'member' ? '已啟用' : '普通版';
      }

      async function callChatApi(message) {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        return response.json();
      }

      dashboardChatForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const value = dashboardChatInput.value.trim();
        if (!value) return;

        appendMessage('user', value);
        dashboardChatInput.value = '';

        try {
          const data = await callChatApi(value);
          appendMessage('ai', data.reply || '我先幫你整理出具體優先級與行動方案。');
        } catch (error) {
          appendMessage('ai', '這個方向很適合先鎖定目標客群，再將 AI 融入客服、CRM 或數據分析。');
        }
      });

      logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('novaflowMember');
        localStorage.removeItem('novaflowMode');
        localStorage.removeItem('novaflowPlan');
        window.location.href = '/index.html';
      });

      initDashboard();
    </script>
  </body>
</html>
